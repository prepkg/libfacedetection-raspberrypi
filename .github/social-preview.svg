<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <circle cx="260" cy="320" r="220" fill="url(#glow)"/>

  <g>
    <!-- viewfinder corner brackets -->
    <g stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M175,240 v-30 h30"/>
      <path d="M345,240 v-30 h-30"/>
      <path d="M175,360 v30 h30"/>
      <path d="M345,360 v30 h-30"/>
    </g>

    <!-- head + shoulders silhouette -->
    <path d="M158,452 Q158,368 260,368 Q362,368 362,452 Z" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="260" cy="298" r="66" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="4"/>

    <!-- bounding box -->
    <rect x="175" y="210" width="170" height="180" rx="8" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.55"/>

    <!-- eyes -->
    <g fill="#3b82f6">
      <circle cx="234" cy="288" r="6"/>
      <circle cx="286" cy="288" r="6"/>
    </g>

    <!-- nose -->
    <path d="M260,300 v20" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- mouth -->
    <path d="M236,326 Q260,344 284,326" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <text x="480" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="600" letter-spacing="4" fill="#8b949e">PREPKG</text>

  <text x="478" y="330" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="60" font-weight="800" fill="#f0f6fc">libfacedetection</text>

  <text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#8b949e">
    <tspan x="480" y="392">Precompiled binaries for Raspberry Pi OS</tspan>
    <tspan x="480" y="432">64-bit - always up to date</tspan>
  </text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
    <g>
      <rect x="480" y="480" width="220" height="56" rx="28" fill="#21262d" stroke="#30363d"/>
      <text x="590" y="516" text-anchor="middle" fill="#e6edf3">Raspberry Pi OS</text>
    </g>
    <g>
      <rect x="716" y="480" width="150" height="56" rx="28" fill="#21262d" stroke="#30363d"/>
      <text x="791" y="516" text-anchor="middle" fill="#e6edf3">aarch64</text>
    </g>
  </g>
</svg>
